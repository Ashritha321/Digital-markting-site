<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Marketing - Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans text-gray-800">

  <!-- Navbar -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
      <h1 class="text-2xl font-bold text-indigo-600">Digital Marketing</h1>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active text-indigo-600 font-semibold">Contact</a>
      </nav>
      <button id="menu-btn" class="md:hidden focus:outline-none">
        <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <nav id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
      <a href="index.html" class="block px-6 py-3 hover:bg-indigo-50">Home</a>
      <a href="services.html" class="block px-6 py-3 hover:bg-indigo-50">Services</a>
      <a href="about.html" class="block px-6 py-3 hover:bg-indigo-50">About</a>
      <a href="contact.html" class="block px-6 py-3 bg-indigo-50 font-semibold">Contact</a>
    </nav>
  </header>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>

  <!-- Hero -->
  <section class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-16 text-center">
    <h2 class="text-4xl font-bold hero-title">Contact Us</h2>
    <p class="mt-4 text-lg text-indigo-100 hero-subtitle">Let’s talk about growing your business together.</p>
  </section>

  <!-- Contact Form -->
  <section class="py-16 bg-white">
    <div class="container mx-auto px-6 max-w-lg">
      <form class="space-y-4 bg-gray-50 p-6 rounded-lg shadow card">
        <input type="text" placeholder="Your Name" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-600" required>
        <input type="email" placeholder="Your Email" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-600" required>
        <textarea placeholder="Your Message" rows="5" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-600" required></textarea>
        <button type="submit" class="btn w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Map / Address -->
  <section class="py-16 bg-gray-50 text-center">
    <h3 class="text-2xl font-bold text-gray-900">Visit Us</h3>
    <p class="mt-2 text-gray-600">123 Business Street, Bangalore, India</p>
    <p class="text-gray-600">Email: info@digitalmarketing.com | Phone: +91 98765 43210</p>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 py-10 text-center">
    <p>© 2025 Digital Marketing. All rights reserved.</p>
  </footer>
</body>
</html>
